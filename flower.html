<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main.css">
    <title>Flores Amarillas</title>
</head>
<body class="container">
    <div class="titulo">
        <h1>Haz clic para que florezca la música 🌻</h1>
    </div>

    <!-- El reproductor de audio apuntando a tracker.mp3 -->
    <audio id="player" src="./tracker.mp3" preload="auto"></audio>

    <div class="flowers">
        <!-- Aquí va el código de tus flores (divs de flower, leaf, etc.) -->
        <div class="flower flower--1">
            <div class="flower__leafs flower__leafs--1">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__leaf flower__leaf--4"></div>
                <div class="flower__white-circle"></div>
            </div>
            <div class="flower__line"></div>
        </div>
        <!-- ... puedes repetir los bloques de flores que ya tenías ... -->
    </div>

    <!-- Capa para mostrar la letra -->
    <div id="lyrics" style="position: fixed; bottom: 15%; width: 100%; text-align: center; color: #fff; font-size: 1.5rem; text-shadow: 2px 2px 4px #000; opacity: 0; transition: opacity 0.5s;"></div>

    <script src="anim.js"></script>
    <script src="main.js"></script>
</body>
</html>
