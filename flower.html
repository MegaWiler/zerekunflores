<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main.css" />

    <title>Flower Karaoke</title>
    <style>
  /* Barra superior de karaoke estilo flores amarillas */
  #lyric-container {
    position: fixed;
    top: 30px;
    width: 100%;
    text-align: center;
    z-index: 9999;
    pointer-events: none;
  }
  #lyrics {
    display: inline-block;
    padding: 12px 25px;
    background: rgba(0, 0, 0, 0.7); /* Sombreado oscuro profundo */
    color: #FFD700; /* AMARILLO ORO para combinar con las flores */
    font-family: 'Arial Black', sans-serif;
    font-size: 1.6rem;
    border-radius: 20px;
    border: 1px solid rgba(255, 215, 0, 0.3); /* Bordecito sutil amarillo */
    transition: all 0.3s ease;
    text-shadow: 2px 2px 8px rgba(0, 0, 0, 1);
    font-weight: bold;
  }
</style>
  </head>
  <body class="container">
    <!-- El reproductor usa la nueva canción de Alec Benjamin -->
    <audio id="player" src="sound/Alec Benjamin Water Fountain (Lyrics).mp3" autoplay></audio>
    
    <div id="lyric-container">
      <div id="lyrics"></div>
    </div>

    <h1 class="titulo">Estas flores amarillas son un reflejo de la alegría que traes a mi vida. <br> <br>
      Gracias por las risas que me sacas con tus ocurrencias.</h1>

  </body>
