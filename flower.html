<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>Flores Amarillas 🌻</title>
    <style>
        #lyric-container {
            position: fixed;
            top: 50px; width: 100%; text-align: center; z-index: 9999;
        }
        #lyrics {
            display: inline-block; padding: 15px 30px;
            background: rgba(0, 0, 0, 0.8); color: #FFD700;
            font-size: 1.5rem; border-radius: 30px; border: 2px solid #FFD700;
            font-weight: bold; font-family: sans-serif;
        }
        #mensaje-especial {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; text-align: center; font-size: 1.8rem; width: 80%;
            z-index: 5000; font-family: sans-serif; transition: opacity 2s;
        }
    </style>
</head>
<body class="container">
    <div id="mensaje-especial">
        Estas flores amarillas son un reflejo de la alegría que traes a mi vida. <br><br>
        Gracias por las risas que me sacas con tus ocurrencias. 🌻
    </div>

    <audio id="player" src="sound/musica.mp3" autoplay></audio>

    <div id="lyric-container">
        <div id="lyrics"></div>
    </div>

    <div class="night"></div>
    <div class="flowers">
        <!-- Flor 1 -->
        <div class="flower flower--1">
            <div class="flower__leafs flower__leafs--1">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__leaf flower__leaf--4"></div>
                <div class="flower__white-circle"></div>
            </div>
            <div class="flower__line"></div>
        </div>
        <!-- Copia aquí los demás bloques de flores (flower--2, flower--3) si los tienes -->
    </div>

    <script src="anim.js"></script>
    <script src="main.js"></script>
</body>
</html>
