<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Flores para Eve 🌻</title>
    <style>
        /* Estilos para el Karaoke */
        #lyrics {
            position: fixed;
            bottom: 12%;
            width: 100%;
            text-align: center;
            color: #ffeb3b; /* Amarillo brillante */
            font-family: 'Arial', sans-serif;
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 2px 2px 8px #000;
            z-index: 9999;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .instruccion-inicio {
            position: fixed;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 1rem;
            z-index: 10000;
            background: rgba(0,0,0,0.5);
            padding: 10px 0;
        }
    </style>
</head>
<body class="container">
    <div class="instruccion-inicio">Haz clic en cualquier parte para activar la música 🎵</div>

    <!-- REPRODUCTOR DE AUDIO -->
    <audio id="player" src="tracker.mp3" preload="auto"></audio>

    <div id="lyrics"></div>

    <div class="flowers">
        <!-- Tus flores se generarán aquí con anim.js -->
    </div>

    <script src="anim.js"></script>
    <script src="main.js"></script>
</body>
</html>
