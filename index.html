<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Para Eve 👋</title>
    <style>
        body {
            background-color: #000;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .greetings { font-size: 3rem; font-weight: bold; margin-bottom: 20px; }
        .greetings span { display: inline-block; animation: bounce 0.5s infinite alternate; }
        img { max-width: 250px; border-radius: 20px; margin: 20px 0; border: 3px solid #0022ff; }
        .description { margin-bottom: 30px; font-size: 1.2rem; color: #ccc; }
        .btn-azul {
            background-color: #0022ff;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.2s;
            display: inline-block;
        }
        .btn-azul:hover { transform: scale(1.1); background-color: #001acc; }
        @keyframes bounce { to { transform: translateY(-10px); } }
    </style>
</head>
<body>
    <div class="greetings">
        <span>H</span><span>o</span><span>l</span><span>a</span><span>!</span>
    </div>
    <img src="img/mapache flor.jpg" alt="Mapache">
    <div class="description">
        ESTE PEQUEÑO DETALLE ES PARA TI EVE :)
    </div>
    <a href="flower.html" class="btn-azul">PRESIONA AQUÍ</a>
</body>
</html>
