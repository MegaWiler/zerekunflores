<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>Para Eve 🌻</title>
    <style>
        /* Estilos del Karaoke */
        #lyric-container {
            position: fixed;
            top: 50px;
            width: 100%;
            text-align: center;
            z-index: 9999;
            display: none; 
        }
        #lyrics {
            display: inline-block;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.85);
            color: #FFD700;
            font-family: 'Segoe UI', sans-serif;
            font-size: 1.5rem;
            border-radius: 30px;
            border: 2px solid #FFD700;
            font-weight: bold;
        }

        /* Pantalla de Inicio (Hola y Mapache) */
        .inicio-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #000;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10000;
            transition: opacity 1s ease;
        }

        .btn-azul {
            background-color: #0022ff;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(0, 34, 255, 0.6);
            margin-top: 20px;
        }

        /* Frase especial después del clic */
        #mensaje-especial {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            text-align: center;
            font-size: 1.8rem;
            width: 80%;
            z-index: 5000;
            display: none;
            font-family: 'Segoe UI', sans-serif;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        @keyframes fadeOutText {
            to { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body class="not-loaded">

    <div id="pantalla-inicio" class="inicio-container">
        <h1 style="font-family: sans-serif; margin-bottom: 10px;">¡HOLA! 👋</h1>
        <img src="img/mapache flor.jpg" alt="Mapache" style="max-width: 250px; border-radius: 20px;">
        <h2 style="font-family: sans-serif; margin-top: 20px; text-align: center; padding: 0 20px;">
            ESTE PEQUEÑO DETALLE ES PARA TI EVE :)
        </h2>
        <button id="btn-iniciar" class="btn-azul">PRESIONA AQUÍ</button>
    </div>

    <div id="mensaje-especial">
        Estas flores amarillas son un reflejo de la alegría que traes a mi vida. <br><br>
        Gracias por las risas que me sacas con tus ocurrencias. 🌻
    </div>

    <audio id="player" src="sound/musica.mp3"></audio>

    <div id="lyric-container">
        <div id="lyrics"></div>
    </div>

    <div class="night"></div>
    <div class="flowers">
        <div class="flower flower--1"><div class="flower__leafs"><div class="flower__leaf flower__leaf--1"></div><div class="flower__white-circle"></div></div><div class="flower__line"></div></div>
        <div class="flower flower--2"><div class="flower__leafs"><div class="flower__leaf flower__leaf--1"></div><div class="flower__white-circle"></div></div><div class="flower__line"></div></div>
        <div class="flower flower--3"><div class="flower__leafs"><div class="flower__leaf flower__leaf--1"></div><div class="flower__white-circle"></div></div><div class="flower__line"></div></div>
    </div>

    <script>
        const btn = document.getElementById('btn-iniciar');
        const pantalla = document.getElementById('pantalla-inicio');
        const mensaje = document.getElementById('mensaje-especial');
        const audio = document.getElementById('player');
        const lyricsCont = document.getElementById('lyric-container');
        const lyricsText = document.getElementById('lyrics');

        const lyricsData = [
            { text: "She told me that she loved me by the water fountain", time: 14.36 },
            { text: "She told me that she loved me and she didn't love him", time: 17.62 },
            { text: "And that was really lovely 'cause it was innocent", time: 21.35 },
            { text: "But now she's got a cup with something else in it", time: 24.86 },
            { text: "Too young... I was too young 🌻", time: 78.60 }
        ];

        btn.addEventListener('click', () => {
            audio.play();
            
            // Ocultar inicio
            pantalla.style.opacity = '0';
            
            setTimeout(() => {
                pantalla.style.display = 'none';
                
                // Mostrar frase romántica por 5 segundos
                mensaje.style.display = 'block';
                
                setTimeout(() => {
                    // Desvanecer frase y mostrar flores + karaoke
                    mensaje.style.animation = "fadeOutText 2s forwards";
                    
                    setTimeout(() => {
                        mensaje.style.display = 'none';
                        lyricsCont.style.display = 'block';
                        document.body.classList.remove("not-loaded");
                        document.body.classList.add("flowers-visible");
                    }, 2000);
                }, 5000); // Duración de la frase en pantalla
            }, 1000);
        });

        audio.addEventListener('timeupdate', () => {
            let time = audio.currentTime;
            let line = lyricsData.find((l, i) => time >= l.time && (!lyricsData[i+1] || time < lyricsData[i+1].time));
            if (line) {
                lyricsText.innerText = line.text;
                lyricsText.style.opacity = 1;
            }
        });
    </script>
</body>
</html>
