<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Para Eve :)</title>
</head>
<body class="container">
    <!-- Pantalla de Bienvenida (Overlay) -->
    <div id="overlay">
        <div class="welcome-container">
            <div class="header-row">
                <h1 class="hola-text">Hola!</h1>
                <img src="img/mapache.jpg" alt="Mapache" class="raccoon-img">
            </div>
            <p class="dedicatoria-mini">ESTE PEQUEÑO DETALLE ES PARA TI EVE :)</p>
            <button id="start-btn">PRESIONA AQUÍ</button>
        </div>
    </div>

    <!-- Audio (Asegúrate que la ruta sea correcta) -->
    <audio id="player" src="sound/ChristianBasso&HaienQiu-Flowers.mp3"></audio>

    <div class="night"></div>

    <h1 class="titulo-principal" id="main-title" style="display: none;">
      Estas flores amarillas son un reflejo de la alegría que traes a mi vida. <br>
      Gracias por las risas que me sacas con tus ocurrencias.
    </h1>

    <div id="lyrics-container">
        <div id="lyrics"></div>
    </div>

    <div class="flowers" id="flower-garden" style="display: none;">
        <!-- Flor 1 -->
        <div class="flower flower--1">
            <div class="flower__leafs flower__leafs--1">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__leaf flower__leaf--4"></div>
                <div class="flower__white-circle"></div>
                <div class="flower__light flower__light--1"></div>
                <div class="flower__light flower__light--2"></div>
                <div class="flower__light flower__light--3"></div>
                <div class="flower__light flower__light--4"></div>
                <div class="flower__light flower__light--5"></div>
                <div class="flower__light flower__light--6"></div>
                <div class="flower__light flower__light--7"></div>
                <div class="flower__light flower__light--8"></div>
            </div>
            <div class="flower__line">
                <div class="flower__line__leaf flower__line__leaf--1"></div>
                <div class="flower__line__leaf flower__line__leaf--2"></div>
                <div class="flower__line__leaf flower__line__leaf--3"></div>
                <div class="flower__line__leaf flower__line__leaf--4"></div>
                <div class="flower__line__leaf flower__line__leaf--5"></div>
                <div class="flower__line__leaf flower__line__leaf--6"></div>
            </div>
        </div>
        <!-- (Puedes repetir más flores aquí si lo deseas) -->
    </div>

    <script src="main.js"></script>
    <script src="anim.js"></script>
</body>
</html>
