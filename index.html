<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>Para Eve 🌻</title>
    <style>
        /* Estilos del Karaoke */
        #lyric-container {
            position: fixed;
            top: 50px;
            width: 100%;
            text-align: center;
            z-index: 9999;
            display: none; 
        }
        #lyrics {
            display: inline-block;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.85);
            color: #FFD700;
            font-family: 'Segoe UI', sans-serif;
            font-size: 1.5rem;
            border-radius: 30px;
            border: 2px solid #FFD700;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        /* Pantalla de Inicio */
        .inicio-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #000;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10000;
            transition: opacity 1s ease;
        }

        .btn-azul {
            background-color: #0022ff;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(0, 34, 255, 0.6);
            margin-top: 20px;
            transition: transform 0.2s;
        }

        .btn-azul:active {
            transform: scale(0.95);
        }

        /* Forzar visualización de flores tras el clic */
        body.flowers-visible .flowers {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
    </style>
</head>
<body class="not-loaded">

    <div id="pantalla-inicio" class="inicio-container">
        <img src="img/mapache flor.jpg" alt="Mapache" style="max-width: 250px; border-radius: 20px;">
        <h2 style="font-family: sans-serif; margin-top: 20px; text-align: center; padding: 0 20px;">
            ESTE PEQUEÑO DETALLE ES PARA TI EVE :)
        </h2>
        <button id="btn-iniciar" class="btn-azul">PRESIONA AQUÍ</button>
    </div>

    <audio id="player" src="sound/musica.mp3"></audio>

    <div id="lyric-container">
        <div id="lyrics"></div>
    </div>

    <div class="night"></div>
    <div class="flowers">
        <div class="flower flower--1">
            <div class="flower__leafs flower__leafs--1">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__leaf flower__leaf--4"></div>
                <div class="flower__white-circle"></div>
            </div>
            <div class="flower__line"></div>
        </div>
        <div class="flower flower--2">
            <div class="flower__leafs flower__leafs--2">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__leaf flower__leaf--4"></div>
                <div class="flower__white-circle"></div>
            </div>
            <div class="flower__line"></div>
        </div>
        <div class="flower flower--3">
            <div class="flower__leafs flower__leafs--3">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__leaf flower__leaf--4"></div>
                <div class="flower__white-circle"></div>
            </div>
            <div class="flower__line"></div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('btn-iniciar');
        const pantalla = document.getElementById('pantalla-inicio');
        const audio = document.getElementById('player');
        const lyricsCont = document.getElementById('lyric-container');
        const lyricsText = document.getElementById('lyrics');

        // Letra sincronizada (Water Fountain)
        const lyricsData = [
            { text: "She told me that she loved me by the water fountain", time: 14.36 },
            { text: "She told me that she loved me and she didn't love him", time: 17.62 },
            { text: "And that was really lovely 'cause it was innocent", time: 21.35 },
            { text: "But now she's got a cup with something else in it", time: 24.86 },
            { text: "Too young... I was too young 🌻", time: 78.60 }
        ];

        btn.addEventListener('click', () => {
            // 1. Iniciar música
            audio.play().catch(e => console.log("Error audio:", e));
            
            // 2. Desvanecer pantalla inicial
            pantalla.style.opacity = '0';
            
            setTimeout(() => {
                pantalla.style.display = 'none';
                lyricsCont.style.display = 'block';
                
                // 3. Activar flores (Quitamos clases de bloqueo y añadimos la de visibilidad)
                document.body.classList.remove("not-loaded");
                document.body.classList.remove("container");
                document.body.classList.add("flowers-visible");
            }, 1000);
        });

        // Sincronizar Karaoke
        audio.addEventListener('timeupdate', () => {
            let time = audio.currentTime;
            let line = lyricsData.find((l, i) => time >= l.time && (!lyricsData[i+1] || time < lyricsData[i+1].time));
            
            if (line) {
                lyricsText.innerText = line.text;
                lyricsText.style.opacity = 1;
            }
        });
    </script>
</body>
</html>
